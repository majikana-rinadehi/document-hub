<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Notion synchronization workflow</title>
  <desc id="description">A workflow from a Notion page update through a webhook, GitHub Actions processing, output storage, and Zenn pull request creation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #172554; }
      .lane { font-size: 18px; font-weight: bold; fill: #334155; }
      .node-title { font-size: 18px; font-weight: bold; }
      .node-body { font-size: 14px; fill: #334155; }
      .decision { font-size: 15px; font-weight: bold; }
      .label { font-size: 14px; font-weight: bold; fill: #475569; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="#f8fafc"/>
  <text x="60" y="55" font-size="28" font-weight="bold">Notion synchronization workflow</text>
  <text x="60" y="82" font-size="15" fill="#475569">Source: proxy/api/webhooks.js, notion-sync.yml, and publish-to-zenn.yml</text>
  <rect x="40" y="110" width="1520" height="235" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="lane" x="65" y="143">Synchronization</text>
  <rect x="70" y="175" width="185" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="node-title" x="162" y="213" text-anchor="middle">Notion</text><text class="node-body" x="162" y="238" text-anchor="middle">Page updated</text>
  <rect x="330" y="175" width="205" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="node-title" x="432" y="206" text-anchor="middle">Proxy API</text><text class="node-body" x="432" y="231" text-anchor="middle">POST /api/webhooks</text><text class="node-body" x="432" y="252" text-anchor="middle">Limit payload to 10 fields</text>
  <rect x="610" y="175" width="205" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="node-title" x="712" y="206" text-anchor="middle">repository_dispatch</text><text class="node-body" x="712" y="231" text-anchor="middle">notion-article-updated</text><text class="node-body" x="712" y="252" text-anchor="middle">entity.id and entity.type</text>
  <rect x="890" y="175" width="225" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="node-title" x="1002" y="206" text-anchor="middle">notion-sync.yml</text><text class="node-body" x="1002" y="231" text-anchor="middle">Process pages only</text><text class="node-body" x="1002" y="252" text-anchor="middle">bun run fetch &lt;entity-id&gt;</text>
  <rect x="1190" y="175" width="290" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="node-title" x="1335" y="206" text-anchor="middle">Fetcher and Processor</text><text class="node-body" x="1335" y="231" text-anchor="middle">Fetch and convert the article</text><text class="node-body" x="1335" y="252" text-anchor="middle">Download images</text>
  <path class="flow" d="M255 225 H330"/><path class="flow" d="M535 225 H610"/><path class="flow" d="M815 225 H890"/><path class="flow" d="M1115 225 H1190"/>
  <rect x="40" y="375" width="1520" height="340" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text class="lane" x="65" y="408">Storage and publication</text>
  <rect x="70" y="450" width="200" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="node-title" x="170" y="482" text-anchor="middle">Save to output/</text><text class="node-body" x="170" y="507" text-anchor="middle">article-id.md and .json</text><text class="node-body" x="170" y="528" text-anchor="middle">Images</text>
  <polygon points="395,438 490,502 395,566 300,502" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="decision" x="395" y="497" text-anchor="middle">Changes in</text><text class="decision" x="395" y="518" text-anchor="middle">output/?</text>
  <rect x="570" y="450" width="220" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="node-title" x="680" y="482" text-anchor="middle">Commit and push main</text><text class="node-body" x="680" y="507" text-anchor="middle">Use a GitHub App token</text><text class="node-body" x="680" y="528" text-anchor="middle">Pass entity-id onward</text>
  <polygon points="925,438 1020,502 925,566 830,502" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="decision" x="925" y="497" text-anchor="middle">Publish to</text><text class="decision" x="925" y="518" text-anchor="middle">Zenn?</text>
  <rect x="1100" y="450" width="220" height="105" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="node-title" x="1210" y="482" text-anchor="middle">publish-to-zenn.yml</text><text class="node-body" x="1210" y="507" text-anchor="middle">Copy article and images</text><text class="node-body" x="1210" y="528" text-anchor="middle">Add frontmatter</text>
  <rect x="1380" y="450" width="135" height="105" rx="52" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="node-title" x="1447" y="493" text-anchor="middle">Create PR</text><text class="node-body" x="1447" y="518" text-anchor="middle">For Zenn</text>
  <path class="flow" d="M1335 275 V400 H170 V450"/><path class="flow" d="M270 502 H300"/><text class="label" x="279" y="488">yes</text><path class="flow" d="M490 502 H570"/><path class="flow" d="M790 502 H830"/><path class="flow" d="M1020 502 H1100"/><text class="label" x="1040" y="488">yes</text><path class="flow" d="M1320 502 H1380"/>
  <path class="branch" d="M395 566 V650 H160"/><text class="label" x="245" y="641">no: end</text><path class="branch" d="M925 566 V650 H1440"/><text class="label" x="1080" y="641">no: end</text>
</svg>
